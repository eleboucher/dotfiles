### Focus
focus_on_window_activation focus

# No `output * bg` here on purpose. Noctalia draws the wallpaper as its own
# background-layer surface, and sway's bg directive spawns a competing swaybg
# on the same layer. Stacking within a layer follows creation order, so at
# session start swaybg came first and stayed harmlessly hidden - but every
# `swaymsg reload` respawns swaybg *after* Noctalia, putting a flat colour on
# top and blanking the wallpaper. Noctalia owns the wallpaper; sway should not
# also set one.

### VRR. Hyprland ran vrr 2 (fullscreen only). Sway's adaptive_sync is a
# static on/off per output with no fullscreen-only mode, and leaving it on
# unconditionally caused visible flicker on ordinary desktop content on the
# LG UltraGears. Default off here; scripts/vrr-follow-fullscreen.fish
# (started in execs.conf) toggles it on only for outputs currently showing
# a fullscreen window, matching the old Hyprland behavior.
output * adaptive_sync off

### Tearing. output_can_tear() in swayfx requires output->allow_tearing AND the
# view opting in, so the per-window `allow_tearing yes` rules in rules.conf are
# inert without this. Safe globally: it only ever applies to a fullscreen window
# that has itself allowed tearing.
output * allow_tearing yes
