### Focus
focus_on_window_activation focus

### Background shown where no window covers the output
output * bg #1a1d21 solid_color

### VRR. Hyprland ran vrr 2 (fullscreen only). Sway's adaptive_sync is a
# static on/off per output with no fullscreen-only mode, and leaving it on
# unconditionally caused visible flicker on ordinary desktop content on the
# LG UltraGears. Default off here; scripts/vrr-follow-fullscreen.fish
# (started in execs.conf) toggles it on only for outputs currently showing
# a fullscreen window, matching the old Hyprland behavior.
output * adaptive_sync off
