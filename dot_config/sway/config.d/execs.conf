### systemd / D-Bus activation environment and compositor readiness
# See scripts/session-env.sh - it must not be inlined here, sway's parser
# splits shell lines on `;`.
exec ~/.config/sway/scripts/session-env.sh

# Keyring is handled by gnome-keyring-daemon.service (already enabled, with a
# superset of components) and the polkit agent by Noctalia (polkit_agent = true),
# so neither is started here. The old polkit-gnome exec pointed at a binary that
# does not exist on this system and failed on every startup.

### Clipboard history
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store

### Auto delete trash 30 days old
exec trash-empty 30

### Cursors
exec gsettings set org.gnome.desktop.interface cursor-theme 'Sweet-cursors'
exec gsettings set org.gnome.desktop.interface cursor-size 24

### Location provider
exec /usr/lib/geoclue-2.0/demos/agent
# Night light runs as gammastep.service (WantedBy=graphical-session.target,
# Restart=on-failure) rather than a bare exec with a sleep race.

### Forward bluetooth media commands to MPRIS
exec mpris-proxy

### VRR follows fullscreen state (see misc.conf)
exec ~/.config/sway/scripts/vrr-follow-fullscreen.fish

### Shell
exec noctalia
