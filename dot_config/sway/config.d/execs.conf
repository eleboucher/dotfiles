### systemd / D-Bus activation environment
# Sway does not put WAYLAND_DISPLAY into the systemd activation environment by
# itself. Under uwsm that notification is also what completes
# wayland-wm@sway.desktop.service; without it the unit times out after 30s and
# its OnFailure= tears the whole session down (this is what logged us out).
# `uwsm finalize` does both jobs but exits 1 outside uwsm, so the plain
# sway.desktop session falls back to importing the vars directly.
exec uwsm finalize SWAYSOCK || (systemctl --user import-environment WAYLAND_DISPLAY SWAYSOCK DISPLAY XDG_CURRENT_DESKTOP; dbus-update-activation-environment --systemd WAYLAND_DISPLAY SWAYSOCK DISPLAY XDG_CURRENT_DESKTOP)

### Keyring and auth
exec gnome-keyring-daemon --start --components=secrets
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

### Clipboard history
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store

### Auto delete trash 30 days old
exec trash-empty 30

### Cursors
exec gsettings set org.gnome.desktop.interface cursor-theme 'Sweet-cursors'
exec gsettings set org.gnome.desktop.interface cursor-size 24

### Location provider and night light
exec /usr/lib/geoclue-2.0/demos/agent
exec sleep 1 && gammastep

### Forward bluetooth media commands to MPRIS
exec mpris-proxy

### VRR follows fullscreen state (see misc.conf)
exec ~/.config/sway/scripts/vrr-follow-fullscreen.fish

### Shell
exec noctalia
