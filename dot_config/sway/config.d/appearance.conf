### Borders and gaps
# Hyprland ran gaps_in 2 / gaps_out 4. In sway the gap between windows is
# `inner` and the workspace edge gap is `inner + outer`, so inner 4 with outer
# gated off below reproduces the same 4px everywhere.
default_border pixel 2
default_floating_border pixel 2
gaps inner 4
# Replaces the w[tv1]s[false] / f[1]s[false] workspace rules: outer gaps apply
# only when a workspace holds exactly one window, giving 4 + 16 = 20 as before.
gaps outer 16
smart_gaps inverse_outer

### Corners
corner_radius 20

### Shadows
shadows enable
shadow_blur_radius 20
shadow_color #00000080

### Blur
# Hyprland enabled blur globally then switched it off everywhere except ghostty.
# Sway criteria cannot be negated, so blur is off by default here and switched
# on per surface in rules.conf.
blur disable
blur_radius 8
blur_passes 1

### Animations
# Off entirely. 0.6's animations (open/close fade, move/resize, workspace
# cross-fade) share one global duration with no per-type toggle, and the
# workspace cross-fade shipped with known bugs: switching away from a
# fullscreen workspace can leave the next one invisible (#569), rapid
# open/close can crash (#557), sticky windows render wrong mid-fade (#559).
# This box is also chronically memory-starved (swap under heavy use), so
# short fades read as strobing anyway. Revisit if PR #578 (per-type toggles)
# lands or the alpha-0 bug gets fixed. To change: edit here and RESTART sway -
# never `swaymsg animation_duration_ms 0` or a reload on a live session that
# has animated, that is the #569 mode-B trap (faded workspaces stay invisible).
animation_duration_ms 0

### Static fallback colors, overridden by ~/.config/sway/noctalia
client.focused          #a8c8e0 #101218 #ededf0 #a8c8e0 #a8c8e0
client.unfocused        #101218 #101218 #ededf0 #101218 #101218
client.focused_inactive #101218 #101218 #ededf0 #101218 #101218

### Blur behind Noctalia surfaces
layer_effects "noctalia-bar-default" blur enable
layer_effects "noctalia-dock" blur enable
layer_effects "noctalia-attached-panel" blur enable
layer_effects "noctalia-centered-panel" blur enable
layer_effects "noctalia-floating-panel" blur enable
layer_effects "launcher" blur enable
