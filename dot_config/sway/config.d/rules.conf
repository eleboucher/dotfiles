# ######## Window rules ########

### Ghostty is translucent and the only window that gets blur
for_window [app_id="^com\.mitchellh\.ghostty$"] opacity 0.90, blur enable

### Float
# Hyprland centered every floating window with one blanket rule; sway decides
# floating too late for that, so centering rides along on each rule.
for_window [app_id="^guifetch$"] floating enable, move position center
for_window [app_id="^yad$"] floating enable, move position center
for_window [class="^[Yy]ad$"] floating enable, move position center
for_window [app_id="^zenity$"] floating enable, move position center
for_window [app_id="^wev$"] floating enable, move position center
for_window [app_id="^org\.gnome\.FileRoller$"] floating enable, move position center
for_window [app_id="^file-roller$"] floating enable, move position center
for_window [app_id="^blueman-manager$"] floating enable, move position center
for_window [app_id="^com\.github\.GradienceTeam\.Gradience$"] floating enable, move position center
for_window [app_id="^feh$"] floating enable, move position center
for_window [app_id="^imv$"] floating enable, move position center
for_window [app_id="^system-config-printer$"] floating enable, move position center
for_window [app_id="^org\.quickshell$"] floating enable, move position center

### Float, resize and center
for_window [app_id="^foot$" title="^nmtui$"] floating enable, resize set 60 ppt 70 ppt, move position center
for_window [app_id="^org\.gnome\.Settings$"] floating enable, resize set 70 ppt 80 ppt, move position center
for_window [app_id="^org\.pulseaudio\.pavucontrol$"] floating enable, resize set 60 ppt 70 ppt, move position center
for_window [app_id="^yad-icon-browser$"] floating enable, resize set 60 ppt 70 ppt, move position center
for_window [app_id="^nwg-look$"] floating enable, resize set 50 ppt 60 ppt, move position center

### Scratchpads (replaces Hyprland's named special workspaces)
for_window [app_id="^btop$"] move scratchpad
for_window [app_id="^(feishin|Supersonic|Cider|com\.github\.th_ch\.youtube_music|Plexamp|com-maxrave-simpmusic-MainKt)$"] move scratchpad
for_window [class="^(Spotify|feishin|Supersonic|Cider|Plexamp)$"] move scratchpad
for_window [app_id="^(discord|equibop|vesktop|whatsapp)$"] move scratchpad
for_window [class="^(discord|equibop|vesktop|whatsapp)$"] move scratchpad
for_window [app_id="^Todoist$"] move scratchpad
for_window [class="^Todoist$"] move scratchpad

### Dialogs
for_window [title="^(Select|Open)( a)? (File|Folder)s?$"] floating enable, move position center
for_window [title="^File (Operation|Upload)( Progress)?$"] floating enable, move position center
for_window [title=" Properties$"] floating enable, move position center
for_window [title="^Export Image as PNG$"] floating enable, move position center
for_window [title="^GIMP Crash Debug$"] floating enable, move position center
for_window [title="^Save As$"] floating enable, move position center
for_window [title="^Library$"] floating enable, move position center

### Picture in picture
for_window [title="Picture(-| )in(-| )[Pp]icture"] floating enable, sticky enable, move position 98 ppt 97 ppt

### Ueberzugpp
for_window [app_id="^ueberzugpp_.*$"] floating enable
no_focus [app_id="^ueberzugpp_.*$"]

### Steam
for_window [class="^steam$" title="^Friends List$"] floating enable, move position center

### Games (Steam, Lutris/Wine, Gamescope)
for_window [class="^(steam_app_(default|[0-9]+))$"] allow_tearing yes, inhibit_idle open
for_window [app_id="^gamescope$"] allow_tearing yes, inhibit_idle open
for_window [class="^gamescope$"] allow_tearing yes, inhibit_idle open

### Minecraft launcher consoles
for_window [class="^com-atlauncher-App$" title="^ATLauncher Console$"] floating enable, move position center
for_window [class="^PandoraLauncher$" title="^Minecraft Game Output$"] floating enable, move position center

### Ugh xwayland popups
for_window [shell="xwayland" title="^win[0-9]+$"] shadows disable
