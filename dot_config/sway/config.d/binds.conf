# Keybinds. Shell actions go through Noctalia IPC (noctalia msg ...).

set $noctalia noctalia msg

### Mouse: Hyprland's SUPER+LMB drag / SUPER+RMB resize
floating_modifier $mod normal

# -- Noctalia shell ----------------------------------------------------------
# Hyprland fired the launcher on a bare SUPER tap. Sway has no modifier-tap
# detection, so this moves to $mod+Space.
bindsym $mod+space exec $noctalia panel-toggle launcher
bindsym $mod+b exec $noctalia panel-toggle control-center
bindsym $mod+v exec $noctalia panel-toggle clipboard
bindsym $mod+comma exec $noctalia panel-toggle wallpaper
bindsym $mod+Tab exec $noctalia window-switcher
bindsym $mod+Escape exec $noctalia panel-toggle session
bindsym $mod+Shift+c exec $noctalia settings-toggle
bindsym $mod+Shift+s exec $noctalia screenshot-region
bindsym $mod+Alt+b exec $noctalia config-reload
bindsym $mod+l exec loginctl lock-session

# -- Media / volume / brightness (Noctalia OSD) ------------------------------
bindsym --locked XF86AudioPlay exec $noctalia media toggle
bindsym --locked XF86AudioPrev exec $noctalia media previous
bindsym --locked XF86AudioNext exec $noctalia media next
bindsym --locked XF86AudioMedia exec $noctalia media toggle
bindsym --locked XF86AudioStop exec $noctalia media stop
bindsym --locked XF86AudioRaiseVolume exec $noctalia volume-up
bindsym --locked XF86AudioLowerVolume exec $noctalia volume-down
bindsym --locked XF86AudioMute exec $noctalia volume-mute
bindsym --locked XF86MonBrightnessUp exec $noctalia brightness-up
bindsym --locked XF86MonBrightnessDown exec $noctalia brightness-down
bindsym XF86Calculator exec notify-send "Soon"

# -- Screenshots ------------------------------------------------------------
bindsym --to-code Alt+Shift+4 exec $noctalia screenshot-region
bindsym --to-code Alt+Shift+5 exec sh -c 'mkdir -p ~/Pictures/Screenshots; f=~/Pictures/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png; grim "$f" && wl-copy < "$f"'

# -- Apps -------------------------------------------------------------------
bindsym $mod+t exec ghostty
bindsym $mod+w exec firefox
bindsym $mod+e exec zeditor
bindsym $mod+g exec nautilus

# -- Window actions ---------------------------------------------------------
bindsym $mod+c kill
bindsym $mod+q kill
bindsym $mod+f exec ~/.config/sway/scripts/move-to-empty.fish
bindsym $mod+Shift+f fullscreen toggle

# Focus
bindsym $mod+Up focus up
bindsym $mod+Ctrl+k focus up
bindsym $mod+Down focus down
bindsym $mod+Ctrl+j focus down
bindsym $mod+Left focus left
bindsym $mod+Ctrl+z focus left
bindsym $mod+Ctrl+h focus left
bindsym $mod+Right focus right
bindsym $mod+Ctrl+x focus right
bindsym $mod+Ctrl+l focus right

# Move window
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+h move left
bindsym $mod+Shift+Right move right
bindsym $mod+Shift+l move right
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+k move up
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+j move down

# Resize window
bindsym $mod+Alt+Right resize grow width 50px
bindsym $mod+Alt+l resize grow width 50px
bindsym $mod+Alt+Left resize shrink width 50px
bindsym $mod+Alt+h resize shrink width 50px
bindsym $mod+Alt+Down resize grow height 50px
bindsym $mod+Alt+j resize grow height 50px
bindsym $mod+Alt+Up resize shrink height 50px
bindsym $mod+Alt+k resize shrink height 50px

# -- Workspaces -------------------------------------------------------------
bindsym --to-code $mod+1 workspace number 1
bindsym --to-code $mod+2 workspace number 2
bindsym --to-code $mod+3 workspace number 3
bindsym --to-code $mod+4 workspace number 4
bindsym --to-code $mod+5 workspace number 5
bindsym --to-code $mod+6 workspace number 6
bindsym --to-code $mod+7 workspace number 7
bindsym --to-code $mod+8 workspace number 8
bindsym --to-code $mod+9 workspace number 9
bindsym --to-code $mod+0 workspace number 10

bindsym --to-code $mod+Shift+1 move container to workspace number 1, workspace number 1
bindsym --to-code $mod+Shift+2 move container to workspace number 2, workspace number 2
bindsym --to-code $mod+Shift+3 move container to workspace number 3, workspace number 3
bindsym --to-code $mod+Shift+4 move container to workspace number 4, workspace number 4
bindsym --to-code $mod+Shift+5 move container to workspace number 5, workspace number 5
bindsym --to-code $mod+Shift+6 move container to workspace number 6, workspace number 6
bindsym --to-code $mod+Shift+7 move container to workspace number 7, workspace number 7
bindsym --to-code $mod+Shift+8 move container to workspace number 8, workspace number 8
bindsym --to-code $mod+Shift+9 move container to workspace number 9, workspace number 9
bindsym --to-code $mod+Shift+0 move container to workspace number 10, workspace number 10

bindsym --to-code $mod+Alt+1 move container to workspace number 1
bindsym --to-code $mod+Alt+2 move container to workspace number 2
bindsym --to-code $mod+Alt+3 move container to workspace number 3
bindsym --to-code $mod+Alt+4 move container to workspace number 4
bindsym --to-code $mod+Alt+5 move container to workspace number 5
bindsym --to-code $mod+Alt+6 move container to workspace number 6
bindsym --to-code $mod+Alt+7 move container to workspace number 7
bindsym --to-code $mod+Alt+8 move container to workspace number 8
bindsym --to-code $mod+Alt+9 move container to workspace number 9
bindsym --to-code $mod+Alt+0 move container to workspace number 10

# The wheel runs through ws-wheel.sh, not plain next/prev_on_output: sway
# fires the G502 X's hi-res wheel per raw axis event (several per detent,
# some backward), and next/prev_on_output is a no-op at the edge of an
# output's existing workspaces. The script debounces and steps by number,
# same semantics as $mod+z/x below.
bindsym --whole-window $mod+button5 exec ~/.config/sway/scripts/ws-wheel.sh -1
bindsym --whole-window $mod+button4 exec ~/.config/sway/scripts/ws-wheel.sh +1
# $mod+z/x step by number and will land on a workspace that does not exist yet;
# $mod+Shift+z/x cycle only the ones that do (Hyprland's e-1 / e+1).
bindsym $mod+z exec ~/.config/sway/scripts/ws-relative.fish -1
bindsym $mod+x exec ~/.config/sway/scripts/ws-relative.fish +1
bindsym $mod+Shift+z workspace prev
bindsym $mod+Shift+x workspace next
bindsym $mod+Ctrl+Left exec ~/.config/sway/scripts/ws-relative.fish -1
bindsym $mod+Ctrl+Right exec ~/.config/sway/scripts/ws-relative.fish +1

# -- Scratchpads ------------------------------------------------------------
# Replaces Hyprland's named special workspaces. `[criteria] scratchpad show`
# runs per matching window and hides it if already visible, so each group
# toggles like a special workspace did.
bindsym $mod+Shift+v scratchpad show
bindsym $mod+Alt+v move scratchpad
bindsym $mod+d [app_id="^(discord|equibop|vesktop|whatsapp)$"] scratchpad show; [class="^(discord|equibop|vesktop|whatsapp)$"] scratchpad show
bindsym $mod+m [app_id="^(feishin|Supersonic|Cider|com\.github\.th_ch\.youtube_music|Plexamp|com-maxrave-simpmusic-MainKt)$"] scratchpad show; [class="^(Spotify|feishin|Supersonic|Cider|Plexamp)$"] scratchpad show
bindsym $mod+r [app_id="^Todoist$"] scratchpad show; [class="^Todoist$"] scratchpad show
bindsym Ctrl+Shift+Escape [app_id="^btop$"] scratchpad show

# -- Lid switch -------------------------------------------------------------
# Hyprland locked on any lid transition, then drove DPMS per direction.
bindswitch --locked lid:on exec loginctl lock-session && $noctalia dpms-off
bindswitch --locked lid:off exec loginctl lock-session && $noctalia dpms-on
