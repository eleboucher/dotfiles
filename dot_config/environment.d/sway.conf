# Wayland session environment.
#
# Lives here rather than in ~/.config/uwsm/env-sway because environment.d is
# read by `systemd --user` in both session types - the uwsm one and the plain
# sway.desktop one gdm offers. env-sway only applies under uwsm, so anything
# kept solely there silently vanishes on a non-uwsm login.
#
# XDG_CURRENT_DESKTOP / XDG_SESSION_TYPE / XDG_SESSION_DESKTOP are deliberately
# NOT set here. The session supplies them (sway.desktop's DesktopNames gives
# `sway:wlroots:swayfx`), and pinning XDG_CURRENT_DESKTOP to a bare `sway`
# would drop the wlroots/swayfx names that portal selection and the
# OnlyShowIn/NotShowIn filtering in systemd-xdg-autostart-generator match on.

# SwayFX only nags about the proprietary Nvidia DRM driver (it runs either
# way); this suppresses the swaynag banner without overriding sway.desktop.
SWAY_UNSUPPORTED_GPU=1

### Toolkit backends
GDK_BACKEND=wayland,x11
QT_QPA_PLATFORM=wayland;xcb
SDL_VIDEODRIVER=wayland,x11,windows
CLUTTER_BACKEND=wayland

### Cursors
XCURSOR_THEME=Sweet-cursors
XCURSOR_SIZE=24

### Java
_JAVA_AWT_WM_NONREPARENTING=1
