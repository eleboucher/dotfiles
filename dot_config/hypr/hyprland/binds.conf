# Keybinds. Shell actions go through Noctalia IPC (noctalia msg ...).

$noctalia = noctalia msg

# ── Noctalia shell ──────────────────────────────────────────────────────────
bind = SUPER, Super_L, exec, $noctalia panel-toggle launcher
bind = SUPER, B, exec, $noctalia panel-toggle control-center
bind = SUPER, V, exec, $noctalia panel-toggle clipboard
bind = SUPER, COMMA, exec, $noctalia panel-toggle wallpaper
bind = SUPER, TAB, exec, $noctalia window-switcher
bind = SUPER, ESCAPE, exec, $noctalia panel-toggle session
bind = SUPER SHIFT, C, exec, $noctalia settings-toggle
bind = SUPER SHIFT, S, exec, $noctalia screenshot-region
bind = SUPER ALT, B, exec, $noctalia config-reload
bind = SUPER, L, exec, loginctl lock-session

# ── Media / volume / brightness (Noctalia OSD) ──────────────────────────────
bind = , XF86AudioPlay, exec, $noctalia media toggle
bind = , XF86AudioPrev, exec, $noctalia media previous
bind = , XF86AudioNext, exec, $noctalia media next
bind = , XF86AudioMedia, exec, $noctalia media toggle
bind = , XF86AudioStop, exec, $noctalia media stop
bind = , XF86AudioRaiseVolume, exec, $noctalia volume-up
bind = , XF86AudioLowerVolume, exec, $noctalia volume-down
bind = , XF86AudioMute, exec, $noctalia volume-mute
bind = , XF86MonBrightnessUp, exec, $noctalia brightness-up
bind = , XF86MonBrightnessDown, exec, $noctalia brightness-down
bind = , XF86Calculator, exec, notify-send "Soon"

# ── Screenshots ─────────────────────────────────────────────────────────────
bind = ALT SHIFT, 4, exec, $noctalia screenshot-region
bind = ALT SHIFT, 5, exec, bash -c 'mkdir -p ~/Pictures/Screenshots; f=~/Pictures/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png; grim "$f" && wl-copy < "$f"'

# ── Apps ────────────────────────────────────────────────────────────────────
bind = SUPER, T, exec, ghostty
bind = SUPER, W, exec, zen-browser
bind = SUPER, E, exec, gram
bind = SUPER, G, exec, nautilus

# ── Window actions ──────────────────────────────────────────────────────────
bind = SUPER, C, killactive
bind = SUPER, Q, killactive
bind = SUPER, F, movetoworkspace, emptym
bind = SUPER SHIFT, F, fullscreen, 0
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Focus
bind = SUPER, Up, movefocus, u
bind = SUPER CTRL, k, movefocus, u
bind = SUPER, Down, movefocus, d
bind = SUPER CTRL, j, movefocus, d
bind = SUPER, Left, movefocus, l
bind = SUPER CTRL, z, movefocus, l
bind = SUPER CTRL, h, movefocus, l
bind = SUPER, Right, movefocus, r
bind = SUPER CTRL, x, movefocus, r
bind = SUPER CTRL, l, movefocus, r

# Move window
bind = SUPER SHIFT, Left, movewindow, l
bind = SUPER SHIFT, h, movewindow, l
bind = SUPER SHIFT, Right, movewindow, r
bind = SUPER SHIFT, l, movewindow, r
bind = SUPER SHIFT, Up, movewindow, u
bind = SUPER SHIFT, k, movewindow, u
bind = SUPER SHIFT, Down, movewindow, d
bind = SUPER SHIFT, j, movewindow, d

# Resize window
bind = SUPER ALT, Right, resizeactive, 50 0
bind = SUPER ALT, l, resizeactive, 50 0
bind = SUPER ALT, Left, resizeactive, -50 0
bind = SUPER ALT, h, resizeactive, -50 0
bind = SUPER ALT, Down, resizeactive, 0 50
bind = SUPER ALT, j, resizeactive, 0 50
bind = SUPER ALT, Up, resizeactive, 0 -50
bind = SUPER ALT, k, resizeactive, 0 -50

# ── Workspaces ──────────────────────────────────────────────────────────────
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

bind = SUPER ALT, 1, movetoworkspacesilent, 1
bind = SUPER ALT, 2, movetoworkspacesilent, 2
bind = SUPER ALT, 3, movetoworkspacesilent, 3
bind = SUPER ALT, 4, movetoworkspacesilent, 4
bind = SUPER ALT, 5, movetoworkspacesilent, 5
bind = SUPER ALT, 6, movetoworkspacesilent, 6
bind = SUPER ALT, 7, movetoworkspacesilent, 7
bind = SUPER ALT, 8, movetoworkspacesilent, 8
bind = SUPER ALT, 9, movetoworkspacesilent, 9
bind = SUPER ALT, 0, movetoworkspacesilent, 10

bind = SUPER, mouse_down, workspace, m-1
bind = SUPER, mouse_up, workspace, m+1
bind = SUPER, Z, workspace, -1
bind = SUPER, X, workspace, +1
bind = SUPER SHIFT, Z, workspace, e-1
bind = SUPER SHIFT, X, workspace, e+1
bind = CTRL SUPER, Left, workspace, -1
bind = CTRL SUPER, Right, workspace, +1

# ── Special workspaces ──────────────────────────────────────────────────────
bind = SUPER SHIFT, V, togglespecialworkspace
bind = SUPER ALT, V, movetoworkspace, special
bind = SUPER, D, togglespecialworkspace, communication
bind = SUPER, M, togglespecialworkspace, music
bind = SUPER, R, togglespecialworkspace, todo
bind = CTRL SHIFT, ESCAPE, togglespecialworkspace, sysmon

# ── Lid switch ──────────────────────────────────────────────────────────────
bind = , switch:Lid Switch, exec, loginctl lock-session
bind = , switch:on:Lid Switch, exec, $noctalia dpms-off
bind = , switch:off:Lid Switch, exec, $noctalia dpms-on
