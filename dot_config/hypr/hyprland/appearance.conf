general {
    gaps_in = 2
    gaps_out = 4
    border_size = 2
    col.active_border = rgb(a8c8e0)
    col.inactive_border = rgb(26282e)
    layout = dwindle
}

decoration {
    rounding = 20
    active_opacity = 1.00
    inactive_opacity = 1.00

    shadow {
        enabled = true
        range = 20
        color = rgba(00000080)
    }

    blur {
        enabled = true
        size = 8
        passes = 1
    }
}

animations {
    enabled = true

    bezier = myBezier, 0.4, 0.0, 0.2, 1.0
    animation = windows, 1, 2.5, myBezier, popin 80%
    animation = border, 1, 2.5, myBezier
    animation = fade, 1, 2.5, myBezier
    animation = workspaces, 1, 2.5, myBezier, slidefade 20%
}

# Blur behind Noctalia surfaces
layerrule = blur on, match:namespace noctalia-bar-default
layerrule = blur on, match:namespace noctalia-dock
layerrule = blur on, match:namespace noctalia-attached-panel
layerrule = blur on, match:namespace noctalia-centered-panel
layerrule = blur on, match:namespace noctalia-floating-panel
